repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty
    rev: v0.0.0-alpha.6
    hooks:
      - id: ty
        language: python
        entry: ty check
        types: [python]
        pass_filenames: false
