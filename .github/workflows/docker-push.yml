name: Build & Push Docker Image (Serverless)

on:
  workflow_dispatch:        # manual trigger
  push:
    branches: [main]
    paths:
      - "model/models/server/**"
      - "model/packages/common/**"
      - "model/pyproject.toml"
      - "model/uv.lock"
      - "model/models/server/docker/Dockerfile"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/strg-model

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Download LoRA checkpoint from W&B
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          pip install wandb
          mkdir -p /tmp/lora-checkpoint
          wandb artifact get ahnpolished-ahnpolished/strg-model/qwen2-vl-lora:latest \
            --root /tmp/lora-checkpoint

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: model/models/server/docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LORA_CHECKPOINT=/tmp/lora-checkpoint
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
