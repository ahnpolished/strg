name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.6.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform format check
        run: terraform fmt -check -recursive infra/runpod

      - name: Terraform validate
        working-directory: model/infra/runpod
        run: |
          terraform init -backend=false
          terraform validate

      - name: Ruff lint
        run: uvx ruff@0.9.9 check --fix --exit-non-zero-on-fix .

      - name: Ruff format check
        run: uvx ruff@0.9.9 format --check .

      - name: Type check
        run: uvx ty check packages/common evaluation

  ios-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || echo "Using default Xcode"

      - name: Build iOS app
        run: |
          cd strg-ios
          xcodebuild -scheme strg-ios \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            build | xcpretty && exit ${PIPESTATUS[0]} || true
        continue-on-error: true
