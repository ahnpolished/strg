name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.6.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Ruff lint
        run: uvx ruff@0.9.9 check --fix --exit-non-zero-on-fix .

      - name: Ruff format check
        run: uvx ruff@0.9.9 format --check .

      - name: Type check
        run: uvx ty check packages/common evaluation
