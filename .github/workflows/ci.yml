name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.6.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Run pre-commit hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure
