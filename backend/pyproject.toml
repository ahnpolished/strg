[project]
name = "strg-backend"
version = "0.1.0"
description = "strg workout data backend — FastAPI + SQLAlchemy async + SQLite"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strg_backend"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "aiofiles>=24.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pillow>=11.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
