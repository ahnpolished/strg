[project]
name = "models-server"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "common",
    "torch>=2.0",
    "transformers>=4.45,<4.50",
    "pillow>=10.0",
    "wandb>=0.16",
    "accelerate>=0.26",
    "timm",
    "einops",
    "sentencepiece>=0.2.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.48.0",
    "python-multipart>=0.0.29",
    "peft>=0.13",
    "bitsandbytes>=0.45",
]

[project.optional-dependencies]
serve = ["fastapi", "uvicorn[standard]", "python-multipart"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/models_server"]

[tool.uv.sources]
common = { workspace = true }
