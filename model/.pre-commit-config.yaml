repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
        files: ^infra/runpod/.*\.tf$
      - id: terraform_validate
        files: ^infra/runpod/.*\.tf$

  - repo: local
    hooks:
      - id: ty
        name: ty
        language: system
        entry: uvx ty check packages/common evaluation
        types: [python]
        pass_filenames: false
