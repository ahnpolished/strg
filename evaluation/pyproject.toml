[project]
name = "evaluation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "common",
    "wandb>=0.16",
    "editdistance>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation"]

[tool.uv.sources]
common = { workspace = true }
