[project]
name = "evaluation"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "common",
    "wandb>=0.16",
    "editdistance>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation"]

[tool.uv.sources]
common = { workspace = true }
