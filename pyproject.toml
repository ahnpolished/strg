[tool.uv.workspace]
members = [
    "packages/common",
    "models/server",
    "models/local",
    "evaluation",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.rules]
unresolved-import = "ignore"

[dependency-groups]
dev = [
    "ruff==0.9.9",
    "ty>=0.0.39",
]
