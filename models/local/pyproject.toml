[project]
name = "models-local"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "common",
    "torch>=2.0",
    "transformers>=4.40",
    "pillow>=10.0",
    "wandb>=0.16",
    "coremltools>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/models_local"]

[tool.uv.sources]
common = { workspace = true }
